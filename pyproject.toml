[project]
name = "diamodel"
version = "0.1.0"
description = "A Bayesian model to estimate key diabetes parameters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cmdstanpy~=1.3.0",
    "pandas~=2.3.3",
    "scipy~=1.16.3"
]

[project.optional-dependencies]
dev = [
    "altair~=6.0.0",
    "black~=25.12.0",
    "ipywidgets~=8.1.8",
    "isort~=7.0.0",
    "jupyterlab~=4.5.1",
    "jupyterlab_code_formatter~=3.0.2",
    "matplotlib~=3.10.8",
    "pytest~=9.0.2",
    "seaborn~=0.13.2"
]

[tool.setuptools.packages.find]
include = ["diamodel*"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
